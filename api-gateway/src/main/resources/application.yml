spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/fitness-OAuth2

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: ai-service
              uri: lb://AI-SERVICE
              predicates:
                - Path=/api/recommendations/**

            - id: activity-service
              uri: lb://ACTIVITYSERVICE
              predicates:
                - Path=/api/activities/**
          discovery:
            locator:
              enabled: true



logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: TRACE
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: TRACE
    reactor.netty.http.client: DEBUG
    org.springframework.security: DEBUG

server:
  port: 9095

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/